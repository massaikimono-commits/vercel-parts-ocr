[build]
  command = "npm run build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF app public package.json next.config.mjs tsconfig.json netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/schedule/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/customer-vehicles/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/vehicle-workflow*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/inspection/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/parts-data/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/loaners/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/settings/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"



[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
