name: Customer search memory batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/customer-search-memory-batch.yml
      - scripts/tmp-apply-customer-search-memory.py
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate
        run: python3 scripts/tmp-apply-customer-search-memory.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted and related regression
        run: |
          node scripts/customer-search-memory-regression.mjs
          npm run test:customer-migration-workflow
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Restore and commit source only
        run: |
          git checkout -- .
          python3 scripts/tmp-apply-customer-search-memory.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/customer-vehicles/page.tsx scripts/customer-search-memory-regression.mjs
          git commit -m "ux: remember customer vehicle search state"
          git rm .github/workflows/customer-search-memory-batch.yml scripts/tmp-apply-customer-search-memory.py
          git commit -m "ci: remove customer search memory batch helpers"
          git push origin HEAD:preview/schedule-ux-20260903
