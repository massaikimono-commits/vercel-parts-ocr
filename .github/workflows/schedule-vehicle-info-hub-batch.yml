name: Schedule vehicle-info hub batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/schedule-vehicle-info-hub-batch.yml
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement direct vehicle-info action and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/detail/page.tsx')
          s=p.read_text()
          needle='<button onClick={()=>openVehicleTool("/schedule/active")}>次回予定登録</button>'
          assert needle in s
          addition=needle+'\n                  <button onClick={()=>openVehicleTool("/customer-vehicles")}>顧客・車両情報</button>'
          p.write_text(s.replace(needle, addition, 1))

          p=Path('scripts/schedule-detail-regression.mjs')
          s=p.read_text()
          read_marker='const schedule = fs.readFileSync(new URL("../app/schedule/page.tsx", import.meta.url), "utf8");'
          assert read_marker in s
          read_add=read_marker+'\nconst customerVehicles = fs.readFileSync(new URL("../app/customer-vehicles/page.tsx", import.meta.url), "utf8");'
          s=s.replace(read_marker, read_add, 1)
          marker='console.log("schedule detail regression: ok");'
          assert marker in s
          checks='''assert.ok(detail.includes("顧客・車両情報"), "detail shows direct customer and vehicle information action");\nassert.match(detail, /openVehicleTool\\(\"\\/customer-vehicles\"\\)/, "detail opens existing customer-vehicles page with active vehicle context");\nassert.match(customerVehicles, /const ACTIVE_KEY = \"parts-active-vehicle\"/, "customer-vehicles uses the shared active vehicle key");\nassert.match(customerVehicles, /sessionStorage\\.getItem\\(ACTIVE_KEY\\)/, "customer-vehicles restores active vehicle context");\nassert.match(customerVehicles, /selectVehicle\\(activeVehicle, customer\\)/, "customer-vehicles auto-selects the staged active vehicle");\n'''
          p.write_text(s.replace(marker, checks+marker, 1))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted regressions
        run: |
          npm run test:schedule-detail
          npm run test:schedule-one-day-practical
          npm run test:schedule-work-state
          npm run test:waiting-service-v13
          npm run test:vehicle-business-state
          npm run test:security
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/schedule-vehicle-info-hub-batch.yml
          git add app/schedule/detail/page.tsx scripts/schedule-detail-regression.mjs
          git commit -m "feat: open vehicle info from schedule detail"
          git push origin HEAD:preview/schedule-ux-20260903
