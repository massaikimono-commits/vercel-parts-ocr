name: Schedule next-booking batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/schedule-next-booking-batch.yml
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement direct next-booking action and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/detail/page.tsx')
          s=p.read_text()
          needle='<button onClick={()=>openVehicleTool("/parts-data")}>部品データ</button>'
          assert needle in s
          p.write_text(s.replace(needle, '<button onClick={()=>openVehicleTool("/schedule/active")}>次回予定登録</button>\n                  '+needle, 1))
          p=Path('scripts/schedule-detail-regression.mjs')
          s=p.read_text()
          marker='console.log("schedule detail regression: ok");'
          assert marker in s
          checks='''assert.ok(detail.includes("次回予定登録"), "detail shows next booking action");\nassert.match(detail, /openVehicleTool\\(\"\\/schedule\\/active\"\\)/, "detail opens existing active-vehicle schedule registration");\n'''
          p.write_text(s.replace(marker, checks+marker, 1))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted regressions
        run: |
          npm run test:schedule-detail
          npm run test:schedule-one-day-practical
          npm run test:schedule-work-state
          npm run test:waiting-service-v13
          npm run test:vehicle-business-state
          npm run test:security
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/schedule-next-booking-batch.yml
          git add app/schedule/detail/page.tsx scripts/schedule-detail-regression.mjs
          git commit -m "feat: open next booking from schedule detail"
          git push origin HEAD:preview/schedule-ux-20260903
