name: Customer vehicle quick actions batch
on:
  push:
    branches: [preview/schedule-ux-20260903]
    paths: [.github/workflows/customer-vehicle-quick-actions-batch.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node .github/scripts/apply-customer-quick-actions.mjs
      - run: npm ci --no-audit --no-fund
      - run: |
          node scripts/ux-context-preservation-regression.mjs
          npm run test:security
          npm run test:app-core-safety
      - env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - run: |
          rm .github/workflows/customer-vehicle-quick-actions-batch.yml
          rm .github/scripts/apply-customer-quick-actions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add customer vehicle quick actions"
          git push origin HEAD:preview/schedule-ux-20260903
