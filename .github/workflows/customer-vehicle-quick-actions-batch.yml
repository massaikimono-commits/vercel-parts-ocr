name: Customer vehicle quick actions batch

on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/customer-vehicle-quick-actions-batch.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply UX batch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/customer-vehicles/page.tsx')
          s = p.read_text()

          old = '''  function openParts() {
    if (!selectedVehicle) return;
    selectVehicle(selectedVehicle);
    location.assign("/parts-data");
  }
'''
          new = '''  function openParts() {
    if (!selectedVehicle) return;
    selectVehicle(selectedVehicle);
    location.assign("/parts-data");
  }

  function callSelectedCustomer() {
    const phone = selectedCustomer?.phone.trim();
    if (!phone) return;
    location.href = `tel:${phone.replace(/\\s+/g, "")}`;
  }

  function openSelectedAddress() {
    const address = selectedCustomer?.address.trim();
    if (!address) return;
    window.open(
      `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`,
      "_blank",
      "noopener,noreferrer"
    );
  }
'''
          if old not in s:
              raise SystemExit('openParts anchor not found')
          s = s.replace(old, new, 1)

          old = '''        <input
          className="search"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          inputMode={vehicleSearchMode === "last4" ? "numeric" : vehicleSearchMode === "phone" ? "tel" : "text"}
          maxLength={vehicleSearchMode === "last4" ? 4 : undefined}
          placeholder={vehicleSearchMode === "last4" ? "例：10 / 1234" : vehicleSearchMode === "customer" ? "例：山田 / 株式会社ICB" : "例：090-1234-5678"}
        />
'''
          new = '''        <div className="searchRow">
          <input
            className="search"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            inputMode={vehicleSearchMode === "last4" ? "numeric" : vehicleSearchMode === "phone" ? "tel" : "text"}
            maxLength={vehicleSearchMode === "last4" ? 4 : undefined}
            placeholder={vehicleSearchMode === "last4" ? "例：10 / 1234" : vehicleSearchMode === "customer" ? "例：山田 / 株式会社ICB" : "例：090-1234-5678"}
          />
          {query && <button type="button" className="clearSearch" aria-label="検索をクリア" onClick={() => setQuery("")}>×</button>}
        </div>
'''
          if old not in s:
              raise SystemExit('search input anchor not found')
          s = s.replace(old, new, 1)

          old = '''              <button onClick={() => location.assign("/schedule/active")}>📅 次回予定登録</button>
              <button onClick={() => location.assign("/schedule")}>📅 入出庫予定</button>
              <button onClick={() => location.assign("/vehicle-workflow")}>車両情報を編集</button>
'''
          new = '''              <button onClick={() => location.assign("/schedule/active")}>📅 次回予定登録</button>
              {selectedCustomer?.phone && <button onClick={callSelectedCustomer}>📞 電話する</button>}
              {selectedCustomer?.address && <button onClick={openSelectedAddress}>🗺 地図を開く</button>}
              <button onClick={() => location.assign("/schedule")}>📅 入出庫予定</button>
              <button onClick={() => location.assign("/vehicle-workflow")}>車両情報を編集</button>
'''
          if old not in s:
              raise SystemExit('selected vehicle actions anchor not found')
          s = s.replace(old, new, 1)

          old = '.search,.customerForm input,.customerForm textarea,.linkBox input,.linkBox select{width:100%;border:1px solid #cdd7e5;border-radius:12px;padding:14px;font-size:16px;background:#fff;color:#172033}'
          new = '.search,.customerForm input,.customerForm textarea,.linkBox input,.linkBox select{width:100%;border:1px solid #cdd7e5;border-radius:12px;padding:14px;font-size:16px;background:#fff;color:#172033}.searchRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.clearSearch{min-width:46px;padding:12px 14px;font-size:20px;line-height:1}'
          if old not in s:
              raise SystemExit('search css anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          r = Path('scripts/ux-context-preservation-regression.mjs')
          rs = r.read_text()
          marker = 'assert.ok(detail.includes(\'>1日の予定</button>\'));\n'
          extra = '''assert.ok(customer.includes('aria-label="検索をクリア"'), "customer vehicle search has one-tap clear");
assert.ok(customer.includes('function callSelectedCustomer()'), "selected customer has direct call action");
assert.ok(customer.includes('location.href = `tel:${phone.replace(/\\\\s+/g, "")}`;'), "call action uses tel link");
assert.ok(customer.includes('function openSelectedAddress()'), "selected customer has direct map action");
assert.ok(customer.includes('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}'), "map action encodes address");
'''
          if marker not in rs:
              raise SystemExit('regression anchor not found')
          rs = rs.replace(marker, marker + extra, 1)
          r.write_text(rs)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted regression
        run: |
          node scripts/ux-context-preservation-regression.mjs
          npm run test:security
          npm run test:app-core-safety

      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build

      - name: Commit verified batch and remove temporary workflow
        run: |
          rm .github/workflows/customer-vehicle-quick-actions-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/customer-vehicles/page.tsx scripts/ux-context-preservation-regression.mjs .github/workflows/customer-vehicle-quick-actions-batch.yml
          git commit -m "feat: add customer vehicle quick actions"
          git push origin HEAD:preview/schedule-ux-20260903
