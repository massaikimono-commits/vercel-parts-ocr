name: Customer vehicle menu contract batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/customer-vehicle-menu-contract-batch.yml
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement confirmed vehicle menu links and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/customer-vehicles/page.tsx')
          s=p.read_text()
          needle='''              <button onClick={() => location.assign(`/customer-vehicles/photos?vehicle=${encodeURIComponent(selectedVehicle.id)}`)}>🖼 写真履歴</button>\n              <button onClick={() => location.assign("/schedule")}>📅 入出庫予定</button>'''
          repl='''              <button onClick={() => location.assign(`/customer-vehicles/photos?vehicle=${encodeURIComponent(selectedVehicle.id)}`)}>🖼 写真履歴</button>\n              <button onClick={() => location.assign(`/customer-vehicles/history?vehicle=${encodeURIComponent(selectedVehicle.id)}`)}>🕘 統合履歴</button>\n              <button onClick={() => location.assign(`/customer-vehicles/lease-maintenance?vehicle=${encodeURIComponent(selectedVehicle.id)}`)}>📄 リースメンテ契約</button>\n              <button onClick={() => location.assign("/schedule")}>📅 入出庫予定</button>'''
          assert needle in s, 'vehicle action menu anchor changed'
          p.write_text(s.replace(needle,repl,1))

          p=Path('scripts/customer-migration-workflow-regression.mjs')
          s=p.read_text()
          marker='expect(customer, "/customer-vehicles/bulk-import", "bulk import navigation");'
          checks='''\nexpect(customer, "/customer-vehicles/history?vehicle=", "selected vehicle integrated history navigation");\nexpect(customer, "/customer-vehicles/lease-maintenance?vehicle=", "selected vehicle lease maintenance navigation");'''
          assert marker in s, 'customer regression marker changed'
          p.write_text(s.replace(marker, marker+checks, 1))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted regressions
        run: |
          npm run test:customer-migration-workflow
          npm run test:lease-contract-foundation
          npm run test:vehicle-business-state
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/customer-vehicle-menu-contract-batch.yml
          git add app/customer-vehicles/page.tsx scripts/customer-migration-workflow-regression.mjs
          git commit -m "feat: complete selected vehicle menu links"
          git push origin HEAD:preview/schedule-ux-20260903
