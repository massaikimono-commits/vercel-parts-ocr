name: Internal navigation codemod

on:
  push:
    branches:
      - candidate/internal-navigation-spa-20260914

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[nav-codemod]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply scoped codemod
        run: node scripts/apply-internal-navigation-codemod.mjs

      - name: Verify diff
        run: |
          git diff --check
          git status --short

      - name: Commit candidate-only changes
        run: |
          if git diff --quiet; then
            echo "No codemod changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: convert internal full navigations to Next router [nav-codemod]"
          git push origin HEAD:candidate/internal-navigation-spa-20260914
