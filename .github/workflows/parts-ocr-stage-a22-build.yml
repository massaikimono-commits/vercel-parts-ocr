name: Parts OCR Stage A22 crop correction build

on:
  push:
    branches:
      - eval/parts-ocr-stage-a22-cell-crop-correction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder-key
      NEXT_PUBLIC_EVAL_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage A22 static structural crop audit
        run: node scripts/stage-a22-static-crop-audit.mjs
      - name: Stage A22 invariant fuzz and policy audit
        run: node scripts/stage-a22-invariant-audit.mjs
      - run: npm install
      - name: Build standalone Safari evaluator
        run: node scripts/build-parts-a22-standalone.mjs
      - run: npm run build
