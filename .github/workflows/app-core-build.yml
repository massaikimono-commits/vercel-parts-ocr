name: App core build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/app-core-v1

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_changed: ${{ steps.scope.outputs.app_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect normal app change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            event_before="${{ github.event.before }}"
            event_after="${{ github.event.after }}"
            if [[ "${{ github.event.action }}" == "synchronize" && -n "$event_before" && -n "$event_after" ]]; then
              before="$event_before"
              after="$event_after"
            else
              before="${{ github.event.pull_request.base.sha }}"
              after="${{ github.event.pull_request.head.sha }}"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="${after}^"
            fi
          fi

          changed="$(git diff --name-only "$before" "$after")"
          printf '%s\n' "$changed"

          relevant_pattern='^(app/|scripts/|database/|supabase/|package\.json$|package-lock\.json$|next\.config\.mjs$|tsconfig\.json$|\.github/workflows/(app-core-build|full-regression)\.yml$)'
          ocr_only_pattern='^(app/certificate-|app/lib/certificate-|app/vehicle-certificate-route-enhancers\.tsx$|app/vehicle-workflow/|app/vehicle-workflow-fast/|app/vehicle-workflow-v2/|app/vehicle-workflow-v3/|app/ocr/|scripts/(vehicle-certificate-regression|certificate-|qr-|parts-)|public/tesseract/)'

          app_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" =~ $relevant_pattern ]] && [[ ! "$file" =~ $ocr_only_pattern ]]; then
              app_changed=true
              break
            fi
          done <<< "$changed"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/work/app-core-v1" ]]; then
            forbidden="$(printf '%s\n' "$changed" | grep -E "$ocr_only_pattern" || true)"
            if [[ -n "$forbidden" ]]; then
              echo "OCR tuning files must be changed on a dedicated OCR branch, not work/app-core-v1:"
              printf '%s\n' "$forbidden"
              exit 1
            fi
          fi

          echo "app_changed=$app_changed" >> "$GITHUB_OUTPUT"
          echo "app_changed=$app_changed"

      - name: Validate CI routing contract
        run: node scripts/ci-routing-regression.mjs

  build:
    needs: scope
    if: ${{ needs.scope.outputs.app_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run record regression checks
        run: |
          npm run test:inspection
          npm run test:record-types
          npm run test:workshop-record-types

      - name: Run schedule and daily report regression checks
        run: |
          npm run test:schedule-print
          npm run test:schedule-print-layout
          npm run test:schedule-work-state
          npm run test:schedule-existing-vehicle
          npm run test:schedule-desktop-density
          npm run test:schedule-report-layout
          npm run test:schedule-pickup-rules
          npm run test:schedule-workflow-ux
          npm run test:schedule-registration-duplicate
          npm run test:schedule-registration-action-feedback
          npm run test:schedule-batch-cross-customer
          npm run test:schedule-inbound-time-selector
          npm run test:schedule-edit-inbound-time-selector
          npm run test:schedule-search-work-order
          npm run test:schedule-cancellation-work-order
          npm run test:schedule-search-actions
          npm run test:schedule-one-day-practical
          npm run test:schedule-detail
          npm run test:daily-report-template
          npm run test:daily-report-allocation
          npm run test:daily-report-print-model
          npm run test:daily-report-secondary
          npm run test:daily-report-work-code
          npm run test:vehicle-business-state

      - name: Run app safety and customer regression checks
        run: |
          npm run test:paper-sizes
          npm run test:security
          npm run test:app-core-safety
          npm run test:lease-contract-foundation
          npm run test:customer-migration-workflow
          node scripts/ci-routing-regression.mjs

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
