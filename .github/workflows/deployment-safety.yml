name: Deployment safety guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate Netlify TOML syntax
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("netlify.toml").open("rb") as f:
              tomllib.load(f)

          print("netlify.toml syntax is valid.")
          PY

      - name: Verify deployment locks
        run: node scripts/deployment-safety-regression.mjs
