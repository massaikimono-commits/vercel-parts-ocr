name: OCR regression

on:
  push:
    branches:
      - main
      - fix/certificate-pdf-native-v1
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run vehicle-certificate regression
        run: npm run test:certificate

      - name: Run QR speed regression
        run: npm run test:qr-speed

      - name: Run parts-slip regression
        run: npm run test:parts

      - name: Run yellow/white parts layout semantics
        run: npm run test:parts-layout

      - name: Run security regression
        run: npm run test:security

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
