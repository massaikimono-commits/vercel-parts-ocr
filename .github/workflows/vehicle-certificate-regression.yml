name: OCR regression

on:
  push:
    branches:
      - main
      - fix/certificate-pdf-native-v1
      - "work/**"
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run vehicle-certificate regression
        run: npm run test:certificate

      - name: Run QR speed regression
        run: npm run test:qr-speed

      - name: Run QR photo contrast regression
        run: node scripts/qr-photo-contrast-regression.mjs

      - name: Run QR low-score 5QR cap regression
        run: node scripts/qr-photo-soft-cap-regression.mjs

      - name: Run QR distractor precision regression
        run: node scripts/qr-photo-distractor-regression.mjs

      - name: Run QR stacked-sheet precision regression
        run: node scripts/qr-photo-stacked-sheet-regression.mjs

      - name: Run QR perspective regression
        run: node scripts/qr-photo-perspective-regression.mjs

      - name: Run QR glare regression
        run: node scripts/qr-photo-glare-regression.mjs

      - name: Run parts-slip regression
        run: npm run test:parts

      - name: Run yellow/white parts layout semantics
        run: npm run test:parts-layout

      - name: Run white parts wrapped-name regression
        run: node scripts/parts-white-wrap-regression.mjs