name: Manual Vercel Preview (Pinned SHA)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA to deploy"
        required: true
        type: string
      confirmation:
        description: "Type PREVIEW_ONLY"
        required: true
        type: string
      reason:
        description: "Why this preview is needed (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-vercel-preview
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_GHd3ONZSRilQtxTq1q6NS1jT
  VERCEL_PROJECT_ID: prj_GUedEKT5z3vrL7NMLGhx04jgPeMK
  VERCEL_CLI_VERSION: 59.11.7

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate manual safety inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "PREVIEW_ONLY" ]]; then
            echo "::error::confirmation must be exactly PREVIEW_ONLY"
            exit 1
          fi
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be an exact 40-character Git SHA"
            exit 1
          fi

      - name: Checkout the exact requested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify checked out SHA is exact
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          REQUESTED_SHA="$(printf '%s' '${{ inputs.commit_sha }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]]; then
            echo "::error::HEAD mismatch. requested=$REQUESTED_SHA actual=$ACTUAL_SHA"
            exit 1
          fi
          echo "Pinned preview SHA: $ACTUAL_SHA"

      - name: Enforce deployment governance contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'vercel.json';
          if (!fs.existsSync(p)) {
            console.error('::error::vercel.json is required');
            process.exit(1);
          }
          const v = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (v?.git?.deploymentEnabled !== false) {
            console.error('::error::git.deploymentEnabled must remain false');
            process.exit(1);
          }
          console.log('Deployment governance OK: automatic Git deploy remains disabled.');
          NODE

      - name: Require Vercel token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Preview project settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN"

      - name: Build exact SHA for Preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} build \
            --token="$VERCEL_TOKEN"

      - name: Deploy Preview only
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --prebuilt \
            --archive=tgz \
            --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ inputs.commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production promotion: NOT PERFORMED" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect created deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} inspect "$PREVIEW_URL" \
            --token="$VERCEL_TOKEN"
