name: Temporary Candidate Lock PoC Build

on:
  push:
    branches:
      - management/live-candidate-lock-poc-build

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: management/live-candidate-lock-poc-build
          fetch-depth: 0
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Candidate-Lock PoC patch
        run: python3 scripts/_tmp_apply_candidate_lock_poc.py
      - name: Remove temporary build machinery
        run: rm .github/workflows/_tmp-candidate-lock-poc.yml scripts/_tmp_apply_candidate_lock_poc.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unknown-Safe and Candidate-Lock tests
        run: node scripts/certificate-qr-live-unknown-safe-contract-test.mjs
      - name: Vehicle certificate regression
        run: npm run test:certificate
      - name: Deployment safety regression
        run: node scripts/deployment-safety-regression.mjs
      - name: Full Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit tested PoC
        run: |
          git config user.name "massaikimono-commits"
          git config user.email "massa_ikimono@icloud.com"
          git add app/eval/certificate-qr-live-scan/page.jsx scripts/certificate-qr-live-unknown-safe-contract-test.mjs
          git add -u .github/workflows scripts
          git commit -m "live qr: add registered remaining-one candidate lock poc"
          git push origin HEAD:management/live-candidate-lock-poc-build
