name: UX batch 2 verify

on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/ux-batch-2.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UX batch
        run: python3 .github/ux-batch-2-apply.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted regressions
        run: |
          node scripts/customer-vehicle-daily-ux-regression.mjs
          npm run test:customer-migration-workflow
          npm run test:vehicle-business-state
          npm run test:schedule-detail
          npm run test:schedule-one-day-practical
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
        run: npm run build
      - name: Commit verified UX batch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ux-batch-2.yml .github/ux-batch-2-apply.py
          git add app/customer-vehicles/page.tsx scripts/customer-vehicle-daily-ux-regression.mjs .github/workflows/ux-batch-2.yml .github/ux-batch-2-apply.py
          git commit -m 'feat: reduce repeated customer vehicle actions'
          git push origin HEAD:preview/schedule-ux-20260903
