name: Schedule call-customer batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/schedule-call-customer-batch.yml
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement direct phone action and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/detail/page.tsx')
          s=p.read_text()
          helper='''\n  function callCustomer(){\n    const phone=customer?.phone?.replace(/[^\\d+]/g,"") || "";\n    if(!phone) return;\n    location.href=`tel:${phone}`;\n  }\n'''
          anchor='''\n  function openVehicleTool(path:string){\n'''
          assert anchor in s
          assert 'function callCustomer()' not in s
          s=s.replace(anchor, helper+anchor, 1)
          needle='<div><span>電話番号</span><b>{customer?.phone || "未登録"}</b></div>'
          assert needle in s
          replacement='<div><span>電話番号</span><b>{customer?.phone || "未登録"}</b>{customer?.phone && <button type="button" className="phoneButton" onClick={callCustomer}>電話する</button>}</div>'
          s=s.replace(needle,replacement,1)
          p.write_text(s)

          p=Path('scripts/schedule-detail-regression.mjs')
          s=p.read_text()
          marker='console.log("schedule detail regression: ok");'
          assert marker in s
          assert 'detail offers one-tap customer phone call' not in s
          checks='''assert.match(detail, /function callCustomer\\(\\)[\\s\\S]*customer\\?\\.phone\\?\\.replace\\(\\/\\[\\^\\\\d\\+\\]\\/g,""\\)[\\s\\S]*location\\.href=`tel:\\$\\{phone\\}`/s, "detail normalizes the stored phone number and opens the native phone dialer");\nassert.match(detail, /customer\\?\\.phone && <button[^>]*onClick=\\{callCustomer\\}>電話する<\\/button>/, "detail offers one-tap customer phone call only when a phone number exists");\n'''
          p.write_text(s.replace(marker, checks+marker, 1))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted regressions
        run: |
          npm run test:schedule-detail
          npm run test:schedule-one-day-practical
          npm run test:schedule-work-state
          npm run test:waiting-service-v13
          npm run test:vehicle-business-state
          npm run test:security
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/schedule-call-customer-batch.yml
          git add app/schedule/detail/page.tsx scripts/schedule-detail-regression.mjs
          git commit -m "feat: call customer from schedule detail"
          git push origin HEAD:preview/schedule-ux-20260903
