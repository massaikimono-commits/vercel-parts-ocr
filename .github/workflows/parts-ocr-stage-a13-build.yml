name: Parts OCR Stage A13 diagnostic build

on:
  push:
    branches:
      - eval/parts-ocr-stage-a13-phase-loss-diagnostic
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder-key
      NEXT_PUBLIC_EVAL_HEAD: ${{ github.sha }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
