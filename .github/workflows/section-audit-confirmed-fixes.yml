name: Section audit confirmed fixes

on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - '.github/workflows/section-audit-confirmed-fixes.yml'
      - '.github/scripts/apply-section-audit-confirmed-fixes.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remaining confirmed section fixes
        run: python .github/scripts/apply-section-audit-confirmed-fixes.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted and related regression
        run: |
          node scripts/section-audit-confirmed-fixes-regression.mjs
          node scripts/designated-print-hold-regression.mjs
          npm run test:customer-migration-workflow
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Restore generated build artifacts
        run: |
          git checkout -- next-env.d.ts tsconfig.json public/tesseract || true
      - name: Commit verified source changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/apply-section-audit-confirmed-fixes.py .github/workflows/section-audit-confirmed-fixes.yml
          git add app/settings/login-history/page.tsx app/customer-vehicles/page.tsx scripts/section-audit-confirmed-fixes-regression.mjs .github/scripts/apply-section-audit-confirmed-fixes.py .github/workflows/section-audit-confirmed-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete confirmed parent-spec section gaps'
          git push origin HEAD:preview/schedule-ux-20260903
