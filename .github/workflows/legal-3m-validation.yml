name: Validate legal 3m pre-DB batch

on:
  push:
    branches:
      - preview/schedule-ux-20260903

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted regressions
        run: |
          npm run test:daily-report-work-code
          npm run test:inspection
          npm run test:record-types
          npm run test:workshop-record-types
          npm run test:schedule-detail
          npm run test:waiting-service-v13

      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build
