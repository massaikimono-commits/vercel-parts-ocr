name: Full regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-regression:
    if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'full-regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate CI routing contract
        run: node scripts/ci-routing-regression.mjs

      - name: Run full application regression and build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build

      - name: Run extended vehicle-certificate OCR regressions
        run: |
          node scripts/qr-photo-contrast-regression.mjs
          node scripts/qr-photo-distractor-regression.mjs
          node scripts/qr-density-performance.mjs

      - name: Run extended parts OCR fixture regression
        run: node scripts/parts-photo-fixture-regression.mjs
