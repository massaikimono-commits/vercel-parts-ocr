name: Full regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - ready_for_review
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-regression:
    # Approval contract:
    # - ready_for_review is the one-time approval transition for a draft candidate PR.
    # - full-regression label is the durable approval signal for an open candidate PR.
    # - synchronize only auto-runs when that durable approval label is already present,
    #   so a newly pushed CURRENT HEAD gets a fresh exact-SHA Full Regression without
    #   any Actions UI dispatch. Unapproved PR pushes remain inert.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          startsWith(github.event.pull_request.head.ref, 'candidate/') &&
          github.event.pull_request.state == 'open' &&
          (
            github.event.action == 'ready_for_review' ||
            (github.event.action == 'labeled' && github.event.label.name == 'full-regression') ||
            (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-regression'))
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify approved candidate identity
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PR_STATE" = "open"
          case "$PR_HEAD_REF" in candidate/*) ;; *) echo "Approved PR head must be candidate/*" >&2; exit 1 ;; esac
          test "$PR_HEAD_SHA" = "$EVENT_SHA"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate CI routing contract
        run: node scripts/ci-routing-regression.mjs

      - name: Run full application regression and build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build

      - name: Run extended vehicle-certificate OCR regressions
        run: |
          node scripts/qr-photo-contrast-regression.mjs
          node scripts/qr-photo-distractor-regression.mjs
          node scripts/qr-density-performance.mjs

      - name: Run extended parts OCR fixture regression
        run: node scripts/parts-photo-fixture-regression.mjs
