name: Validate waiting service v13 final

on:
  push:
    branches:
      - preview/schedule-ux-20260903

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate waiting-service-v13-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Waiting-service v13 regression
        run: npm run test:waiting-service-v13
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build
