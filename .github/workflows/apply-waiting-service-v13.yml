name: Apply waiting service v13 patch

on:
  push:
    branches:
      - preview/schedule-ux-20260903

permissions:
  contents: write

jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, '[apply waiting-service-v13]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align patch guards and repair known regression regexes
        run: |
          python - <<'PY'
          from pathlib import Path

          patch = Path('scripts/apply-waiting-service-v13-patch.mjs')
          s = patch.read_text()
          s = s.replace('oldAuthCount !== 6', 'oldAuthCount !== 4')
          s = s.replace('expected 6 historical mutation auth guards', 'expected 4 historical mutation auth guards')
          s = s.replace('.length, 6, "all six schedule mutation signatures must retain active-user hardening"', '.length, 4, "all four mutation signatures redefined by v1.3 must retain active-user hardening"')
          patch.write_text(s)

          one_day = Path('scripts/schedule-one-day-practical-regression.mjs')
          s = one_day.read_text()
          s = s.replace(
            r'/if \\(work\\.reason === "一般整備"\\) return work\\.outsource_vendor_name\\?\\.trim\\(\\) \\? "reason-body" : "reason-repair";/',
            r'/if \(work\.reason === "一般整備"\) return work\.outsource_vendor_name\?\.trim\(\) \? "reason-body" : "reason-repair";/'
          )
          one_day.write_text(s)

          safety = Path('scripts/app-core-safety-regression.mjs')
          s = safety.read_text()
          s = s.replace(
            r'assert((partsReview.match(/saveFormal\\(\\)/g) || []).length === 2, "OCR/review load must not auto-trigger formal save; saveFormal may only exist as the function and explicit save-button call");',
            'assert((partsReview.match(/saveFormal\\(\\)/g) || []).length === 2, "OCR/review load must not auto-trigger formal save; saveFormal may only exist as the function and explicit save-button call");'
          )
          safety.write_text(s)
          PY

      - name: Apply exact source patch
        run: node scripts/apply-waiting-service-v13-patch.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run waiting-service regressions
        run: |
          npm run test:waiting-service-v13
          npm run test:vehicle-business-state
          npm run test:app-core-safety
          npm run test:schedule-registration-duplicate
          npm run test:schedule-workflow-ux

      - name: Run full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build

      - name: Commit tested source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app database docs package.json scripts
          git commit -m 'feat: expand waiting service to all customer visits'
          git push origin HEAD:preview/schedule-ux-20260903
