name: Vehicle registration and name-only schedule implementation

on:
  push:
    branches:
      - feature/vehicle-register-name-only-schedule-20260915

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[vehicle-name-only-impl]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply scoped source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('app/home-dashboard.tsx')
          s = home.read_text()
          old = '''        <div className="mobileActions">\n          <button className="primaryAction" onClick={() => registerDay(todayJst())}>＋ 予定登録</button>\n          <button className="uxDailyReportShortcut"'''
          new = '''        <div className="mobileActions">\n          <button className="primaryAction" onClick={() => registerDay(todayJst())}>＋ 予定登録</button>\n          <button className="vehicleRegisterAction" onClick={() => location.assign("/vehicle-workflow")}>＋ 車両登録</button>\n          <button className="uxDailyReportShortcut"'''
          if old not in s: raise SystemExit('home mobile target not found')
          s = s.replace(old, new, 1)
          old = '''        <div className="desktopHeroGrid">\n          <button className="desktopHero primaryHero" onClick={() => registerDay(todayJst())}><span>予定登録</span><strong>＋ 新しい予定を登録</strong><small>いちばん使う機能</small></button>\n        </div>'''
          new = '''        <div className="desktopHeroGrid">\n          <button className="desktopHero primaryHero" onClick={() => registerDay(todayJst())}><span>予定登録</span><strong>＋ 新しい予定を登録</strong><small>いちばん使う機能</small></button>\n          <button className="desktopHero" onClick={() => location.assign("/vehicle-workflow")}><span>車両登録</span><strong>＋ 車両だけ先に登録</strong><small>予定登録なしで車両情報を保存</small></button>\n        </div>'''
          if old not in s: raise SystemExit('home desktop target not found')
          s = s.replace(old, new, 1)
          home.write_text(s)

          page = Path('app/schedule/new/page.tsx')
          s = page.read_text()
          old = '''    if (selectedVehicleIds.length <= 1 && !registrationNumber.trim() && !registrationLast4.trim()) {\n      setHardErrors(["登録番号またはナンバー下4桁を入力してください。"]);\n      return;\n    }\n\n'''
          if old not in s: raise SystemExit('schedule validation target not found')
          s = s.replace(old, '', 1)
          old = '''        <div className="notice">初入庫は「お客様名＋ナンバー下4桁」だけでも予定登録できます。型式・車台番号・完全な登録番号は、入庫後や車検証読取後に追記できます。</div>'''
          new = '''        <div className="notice">初回電話予約など車番がまだ分からない場合は「お客様名だけ」でも予定登録できます。車番・型式・車台番号は、確認後に顧客・車両情報へ追加できます。</div>'''
          if old not in s: raise SystemExit('schedule notice target not found')
          s = s.replace(old, new, 1)
          old = '''          <label>ナンバー下4桁<input inputMode="numeric" maxLength={4} value={registrationLast4} onChange={(e) => setRegistrationLast4(e.target.value.replace(/\\D/g, "").slice(-4))} /></label>'''
          new = '''          <label>ナンバー下4桁<input inputMode="numeric" maxLength={4} value={registrationLast4} onChange={(e) => setRegistrationLast4(e.target.value.replace(/\\D/g, "").slice(-4))} placeholder="未確認なら空欄で登録可" /></label>'''
          if old not in s: raise SystemExit('schedule last4 target not found')
          s = s.replace(old, new, 1)
          page.write_text(s)

          test = Path('scripts/vehicle-name-only-regression.mjs')
          test.write_text('''import fs from "node:fs";\n\nfunction assert(ok, message) { if (!ok) { console.error(`FAIL: ${message}`); process.exit(1); } console.log(`PASS: ${message}`); }\nconst home = fs.readFileSync("app/home-dashboard.tsx", "utf8");\nconst schedule = fs.readFileSync("app/schedule/new/page.tsx", "utf8");\nassert(home.includes("＋ 車両登録"), "mobile home exposes vehicle registration shortcut");\nassert(home.includes("車両だけ先に登録"), "desktop home exposes vehicle registration shortcut");\nassert(home.includes('location.assign("/vehicle-workflow")'), "vehicle shortcut reuses existing vehicle workflow");\nassert(schedule.includes("お客様名だけ"), "schedule explains name-only provisional registration");\nassert(!schedule.includes("登録番号またはナンバー下4桁を入力してください。"), "plate number is no longer client-required");\nassert(schedule.includes("if (selectedVehicleIds.length <= 1 && !customerName.trim())"), "customer name remains required for single/new registration");\nassert(schedule.includes("resolvedVehicleId") && schedule.includes("sameDayVehicleScheduleWarnings([resolvedVehicleId])"), "same-day vehicle warning remains vehicle-id scoped");\nassert(schedule.includes("p_existing_vehicle_id: selectedVehicleForSubmitNow || null"), "existing vehicle linkage remains unchanged");\nassert(schedule.includes("p_registration_last4:"), "plate data continues to be submitted when available");\nconsole.log("VEHICLE_NAME_ONLY_REGRESSION_PASS");\n''')
          PY
          node scripts/vehicle-name-only-regression.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/home-dashboard.tsx app/schedule/new/page.tsx scripts/vehicle-name-only-regression.mjs
          git commit -m "feat: add vehicle shortcut and allow name-only schedules [vehicle-name-only-impl]"
          git push origin HEAD:feature/vehicle-register-name-only-schedule-20260915