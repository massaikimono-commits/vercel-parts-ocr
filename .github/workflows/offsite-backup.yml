name: Off-site backup

on:
  pull_request:
    branches:
      - fix/certificate-pdf-native-v1
    paths:
      - ".github/workflows/offsite-backup.yml"
      - "scripts/offsite-backup.sh"
      - "OFFSITE-BACKUP.md"
  workflow_dispatch:
  schedule:
    # 04:30 JST every day.
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: icb-offsite-backup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate backup script syntax
        shell: bash
        run: bash -n scripts/offsite-backup.sh
      - name: Confirm workflow is disabled by default
        shell: bash
        run: |
          set -euo pipefail
          grep -F "OFFSITE_BACKUP_ENABLED" .github/workflows/offsite-backup.yml
          grep -F "vars.OFFSITE_BACKUP_ENABLED == 'true'" .github/workflows/offsite-backup.yml

  backup:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.OFFSITE_BACKUP_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Create encrypted off-site backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ vars.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          OFFSITE_S3_ENDPOINT: ${{ vars.OFFSITE_S3_ENDPOINT }}
          OFFSITE_S3_REGION: ${{ vars.OFFSITE_S3_REGION }}
          OFFSITE_S3_BUCKET: ${{ vars.OFFSITE_S3_BUCKET }}
          OFFSITE_S3_ACCESS_KEY_ID: ${{ secrets.OFFSITE_S3_ACCESS_KEY_ID }}
          OFFSITE_S3_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_S3_SECRET_ACCESS_KEY }}
          OFFSITE_CRYPT_PASSWORD: ${{ secrets.OFFSITE_CRYPT_PASSWORD }}
          OFFSITE_CRYPT_SALT: ${{ secrets.OFFSITE_CRYPT_SALT }}
        run: bash scripts/offsite-backup.sh
