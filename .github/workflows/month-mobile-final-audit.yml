name: Month mobile final audit
on:
  push:
    branches:
      - preview/schedule-ux-20260903
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_dummy_for_build_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regression
        run: |
          node scripts/month-mobile-visible-row-count-regression.mjs
          node scripts/security-regression.mjs
          node scripts/app-core-safety-regression.mjs
      - name: Full build
        run: npm run build
