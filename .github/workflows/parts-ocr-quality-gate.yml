name: Parts OCR actual-route quality gate harness

on:
  push:
    branches:
      - eval/parts-ocr-diagnostic-auto
  workflow_dispatch:
    inputs:
      formal_photo_dir:
        description: "Runner-local directory containing the private fixed real-photo set. Leave blank for proxy route smoke only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  route-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: ed2d19cc82b5781848bf37f331ad9b18870c5ce7
          - label: latest
            ref: 6a31ec4b9028410e90a8dbd9c8b40d53de7742d2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
    steps:
      - name: Checkout evaluation harness
        uses: actions/checkout@v4
        with:
          ref: eval/parts-ocr-diagnostic-auto
          path: harness

      - name: Checkout app HEAD under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app-under-test

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install target HEAD dependencies
        working-directory: app-under-test
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium without changing target source
        working-directory: app-under-test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare proxy route-smoke files
        run: |
          mkdir -p /tmp/parts-qg /tmp/parts-qg-assets-${{ matrix.label }}
          base64 -d harness/test/fixtures/parts-diagnostic/yellow-proxy.b64 > /tmp/parts-qg/yellow-proxy.jpg
          base64 -d harness/test/fixtures/parts-diagnostic/white-proxy.b64 > /tmp/parts-qg/white-proxy.jpg
          cat > /tmp/parts-qg/proxy-manifest.json <<'JSON'
          [
            {"filename":"yellow-proxy.jpg","path":"/tmp/parts-qg/yellow-proxy.jpg","set":"yellow-proxy"},
            {"filename":"white-proxy.jpg","path":"/tmp/parts-qg/white-proxy.jpg","set":"white-proxy"}
          ]
          JSON

      - name: Build exact target HEAD
        working-directory: app-under-test
        run: npm run build

      - name: Start exact target HEAD
        working-directory: app-under-test
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/parts-qg-next-${{ matrix.label }}.log 2>&1 &
          echo $! > /tmp/parts-qg-next-${{ matrix.label }}.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ocr/auto >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/parts-qg-next-${{ matrix.label }}.log
          exit 1

      - name: Run actual /ocr/auto route smoke and capture exact OCR runtime assets
        env:
          NODE_PATH: ${{ github.workspace }}/app-under-test/node_modules
        run: |
          cp harness/scripts/parts-ocr-browser-quality-gate.cjs app-under-test/.parts-ocr-browser-quality-gate.cjs
          cd app-under-test
          node .parts-ocr-browser-quality-gate.cjs \
            --base-url http://127.0.0.1:3000 \
            --manifest /tmp/parts-qg/proxy-manifest.json \
            --out /tmp/parts-qg-${{ matrix.label }}-proxy.json \
            --asset-dir /tmp/parts-qg-assets-${{ matrix.label }} \
            --dynamic ${{ matrix.label == 'latest' && 'true' || 'false' }}

      - name: Package exact target runtime for private local-photo execution
        run: |
          rm -rf app-under-test/.next/cache
          tar -C app-under-test -czf /tmp/parts-qg-runtime-${{ matrix.label }}.tar.gz \
            .next public node_modules package.json next.config.mjs
          ls -lh /tmp/parts-qg-runtime-${{ matrix.label }}.tar.gz
          find /tmp/parts-qg-assets-${{ matrix.label }} -maxdepth 1 -type f -printf '%f %s bytes\n' || true

      - name: Run formal fixed-set gate when a private runner-local photo directory is provided
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_photo_dir != '' }}
        env:
          NODE_PATH: ${{ github.workspace }}/app-under-test/node_modules
        run: |
          PHOTO_DIR="${{ inputs.formal_photo_dir }}"
          test -d "$PHOTO_DIR"
          python3 harness/scripts/build-parts-ocr-formal-manifest.py "$PHOTO_DIR" /tmp/parts-qg-formal-manifest.json
          cd app-under-test
          node .parts-ocr-browser-quality-gate.cjs \
            --base-url http://127.0.0.1:3000 \
            --manifest /tmp/parts-qg-formal-manifest.json \
            --out /tmp/parts-qg-${{ matrix.label }}-formal.json \
            --dynamic ${{ matrix.label == 'latest' && 'true' || 'false' }}

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/parts-qg-next-${{ matrix.label }}.log || true

      - name: Upload route-smoke, runtime, captured OCR assets and formal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-ocr-quality-gate-${{ matrix.label }}
          compression-level: 6
          path: |
            /tmp/parts-qg-${{ matrix.label }}-proxy.json
            /tmp/parts-qg-${{ matrix.label }}-formal.json
            /tmp/parts-qg-next-${{ matrix.label }}.log
            /tmp/parts-qg-assets-${{ matrix.label }}/
            /tmp/parts-qg-runtime-${{ matrix.label }}.tar.gz
            /tmp/parts-qg-playwright-${{ matrix.label }}.tar.gz
          if-no-files-found: ignore
