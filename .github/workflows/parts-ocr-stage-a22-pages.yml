name: Parts OCR Stage A22 temporary Pages evaluation

on:
  push:
    branches:
      - eval/parts-ocr-stage-a22-cell-crop-correction
    paths:
      - '.github/workflows/parts-ocr-stage-a22-pages.yml'
      - 'standalone/parts-a22/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: parts-ocr-stage-a22-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages if already enabled
        uses: actions/configure-pages@v6
      - name: Upload standalone evaluator
        uses: actions/upload-pages-artifact@v4
        with:
          path: standalone/parts-a22
      - name: Deploy standalone evaluator
        id: deployment
        uses: actions/deploy-pages@v4
