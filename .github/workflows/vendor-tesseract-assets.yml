name: Vendor Tesseract browser assets once

on:
  push:
    branches:
      - fix/certificate-pdf-native-v1
    paths:
      - ".github/workflows/vendor-tesseract-assets.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch exact language data packages without modifying package files
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund \
            @tesseract.js-data/jpn@1.0.0 \
            @tesseract.js-data/eng@1.0.0

      - name: Copy exact browser OCR assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/tesseract/core public/tesseract/lang

          cp node_modules/tesseract.js/dist/worker.min.js \
            public/tesseract/worker.min.js

          for file in \
            tesseract-core.wasm.js \
            tesseract-core-simd.wasm.js \
            tesseract-core-lstm.wasm.js \
            tesseract-core-simd-lstm.wasm.js
          do
            cp "node_modules/tesseract.js-core/$file" "public/tesseract/core/$file"
          done

          cp node_modules/@tesseract.js-data/jpn/4.0.0_best_int/jpn.traineddata.gz \
            public/tesseract/lang/jpn.traineddata.gz
          cp node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz \
            public/tesseract/lang/eng.traineddata.gz

          cat > public/tesseract/ASSET_VERSIONS.txt <<'EOF'
tesseract.js=5.1.1
tesseract.js-core=5.1.1
@tesseract.js-data/jpn=1.0.0 (4.0.0_best_int)
@tesseract.js-data/eng=1.0.0 (4.0.0_best_int)
EOF

          test -s public/tesseract/worker.min.js
          test -s public/tesseract/core/tesseract-core.wasm.js
          test -s public/tesseract/core/tesseract-core-simd.wasm.js
          test -s public/tesseract/core/tesseract-core-lstm.wasm.js
          test -s public/tesseract/core/tesseract-core-simd-lstm.wasm.js
          test -s public/tesseract/lang/jpn.traineddata.gz
          test -s public/tesseract/lang/eng.traineddata.gz

      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tesseract
          if git diff --cached --quiet; then
            echo "Assets already match."
            exit 0
          fi
          git commit -m "chore: vendor locked Tesseract browser assets"
          git push origin HEAD:fix/certificate-pdf-native-v1
