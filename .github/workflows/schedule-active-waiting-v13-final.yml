name: Schedule active waiting v13 final

on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - .github/workflows/schedule-active-waiting-v13-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply v1.3 fix
        run: python .github/scripts/apply-active-waiting-v13.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted regression
        run: |
          node scripts/schedule-active-waiting-v13-regression.mjs
          npm run test:waiting-service-v13
          npm run test:schedule-registration-duplicate
          npm run test:schedule-existing-vehicle
          npm run test:schedule-one-day-practical
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Restore generated build artifacts
        run: |
          git checkout -- next-env.d.ts tsconfig.json public/tesseract/lang/eng.traineddata.gz public/tesseract/lang/jpn.traineddata.gz
          git clean -fd public/tesseract/core
      - name: Commit only verified source changes
        run: |
          rm .github/workflows/schedule-active-waiting-v13-final.yml
          rm .github/scripts/apply-active-waiting-v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schedule/active/page.tsx scripts/schedule-active-waiting-v13-regression.mjs
          git add -u .github/workflows/schedule-active-waiting-v13-final.yml .github/scripts/apply-active-waiting-v13.py
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/scripts/apply-active-waiting-v13.py .github/workflows/schedule-active-waiting-v13-final.yml app/schedule/active/page.tsx scripts/schedule-active-waiting-v13-regression.mjs "
          git commit -m "fix: honor waiting service in active vehicle scheduling"
          git push origin HEAD:preview/schedule-ux-20260903
