name: Certificate QR Fast audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify private fixtures are mounted
        run: |
          test -n "$CERT_QR_FIXTURE_DIR"
          test -f "$CERT_QR_FIXTURE_DIR/manifest.json"
        env:
          CERT_QR_FIXTURE_DIR: ${{ env.CERT_QR_FIXTURE_DIR }}
      - name: Apply observation-only instrumentation
        run: node scripts/instrument-certificate-qr-fast-audit.mjs
      - name: Start app
        run: |
          npm run dev > /tmp/cert-qr-app.log 2>&1 &
          echo $! > /tmp/cert-qr-app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/vehicle-workflow-v2 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cert-qr-app.log
          exit 1
      - name: Run real browser audit
        run: node scripts/certificate-qr-fast-audit.mjs
        env:
          CERT_QR_BASE_URL: http://127.0.0.1:3000
          CERT_QR_FIXTURE_DIR: ${{ env.CERT_QR_FIXTURE_DIR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificate-qr-fast-audit-results
          path: |
            audit-results/
            /tmp/cert-qr-app.log
          if-no-files-found: ignore
          retention-days: 7
