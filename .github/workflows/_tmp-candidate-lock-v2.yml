name: Temporary Candidate Lock v2 Build
on:
  push:
    branches:
      - management/live-candidate-lock-v2-build
permissions:
  contents: write
jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply Candidate-Lock v2 patch
        run: |
          sed -i 's/decodeIntegrityPass!==false/decodeIntegrityPass===true/g' scripts/_tmp_candidate_lock_v2_patch.py
          python3 scripts/_tmp_candidate_lock_v2_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/eval/certificate-qr-live-scan/page.jsx')
          s=p.read_text()
          s=s.replace('const completion = full?.completion || full?.parserSeparatedEvaluation?.currentCompletion || {};','const compactCompletion = full?.completion || full?.parserSeparatedEvaluation?.currentCompletion || {};',1)
          s=s.replace('const expected = completion?.expectedQrCount ?? completion?.expected ?? full?.parserSeparatedEvaluation?.currentCompletion?.expectedQrCount ?? null;','const expected = compactCompletion?.expectedQrCount ?? compactCompletion?.expected ?? full?.parserSeparatedEvaluation?.currentCompletion?.expectedQrCount ?? null;',1)
          s=s.replace('const complete = Boolean(completion?.complete ?? full?.parserSeparatedEvaluation?.currentCompletion?.complete);','const complete = Boolean(compactCompletion?.complete ?? full?.parserSeparatedEvaluation?.currentCompletion?.complete);',1)
          s=s.replace('const vehicleKind = completion?.kind ?? full?.parserSeparatedEvaluation?.currentCompletion?.kind ?? "unknown";','const vehicleKind = compactCompletion?.kind ?? full?.parserSeparatedEvaluation?.currentCompletion?.kind ?? "unknown";',1)
          p.write_text(s)
          PY
      - name: Remove temporary build machinery
        run: rm -f .github/workflows/_tmp-candidate-lock-v2.yml scripts/_tmp_candidate_lock_v2_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract and Candidate-Lock tests
        run: node scripts/certificate-qr-live-unknown-safe-contract-test.mjs
      - name: Vehicle certificate regression
        run: npm run test:certificate
      - name: Deployment safety
        run: node scripts/deployment-safety-regression.mjs
      - name: Full Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Commit tested v2
        run: |
          git config user.name massaikimono-commits
          git config user.email massa_ikimono@icloud.com
          git add app/eval/certificate-qr-live-scan/page.jsx scripts/certificate-qr-live-unknown-safe-contract-test.mjs
          git commit -m "live qr: trigger remaining-one lock on safe spatial observation"
          git push origin HEAD:management/live-candidate-lock-v2-build
