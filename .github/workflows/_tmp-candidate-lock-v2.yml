name: Temporary Candidate Lock v2 Build
on:
  push:
    branches:
      - management/live-candidate-lock-v2-build
permissions:
  contents: write
jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Candidate-Lock v2 patch
        run: python3 scripts/_tmp_candidate_lock_v2_patch.py
      - name: Remove temporary build machinery
        run: rm -f .github/workflows/_tmp-candidate-lock-v2.yml scripts/_tmp_candidate_lock_v2_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Contract and Candidate-Lock tests
        run: node scripts/certificate-qr-live-unknown-safe-contract-test.mjs
      - name: Vehicle certificate regression
        run: npm run test:certificate-ocr
      - name: Deployment safety
        run: node scripts/deployment-safety-regression.mjs
      - name: Full Next build
        run: npm run build
      - name: Commit tested v2
        run: |
          git config user.name massaikimono-commits
          git config user.email massa_ikimono@icloud.com
          git add app/eval/certificate-qr-live-scan/page.jsx scripts/certificate-qr-live-unknown-safe-contract-test.mjs
          git commit -m "live qr: trigger remaining-one lock on safe spatial observation"
          git push origin HEAD:management/live-candidate-lock-v2-build
