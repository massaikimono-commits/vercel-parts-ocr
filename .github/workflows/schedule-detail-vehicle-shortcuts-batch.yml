name: Schedule detail vehicle shortcuts batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
    paths:
      - scripts/tmp-apply-schedule-detail-shortcuts.py
      - .github/workflows/schedule-detail-vehicle-shortcuts-batch.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/schedule-ux-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate
        run: python3 scripts/tmp-apply-schedule-detail-shortcuts.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted and safety regression
        run: |
          node scripts/schedule-detail-vehicle-shortcuts-regression.mjs
          node scripts/schedule-detail-regression.mjs
          npm run test:security
          npm run test:app-core-safety
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
      - name: Restore and commit source only
        run: |
          git checkout -- .
          python3 scripts/tmp-apply-schedule-detail-shortcuts.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/schedule/detail/page.tsx scripts/schedule-detail-vehicle-shortcuts-regression.mjs
          git commit -m "ux: add selected vehicle direct shortcuts"
          git rm .github/workflows/schedule-detail-vehicle-shortcuts-batch.yml scripts/tmp-apply-schedule-detail-shortcuts.py
          git commit -m "ci: remove shortcut batch helpers"
          git push origin HEAD:preview/schedule-ux-20260903
