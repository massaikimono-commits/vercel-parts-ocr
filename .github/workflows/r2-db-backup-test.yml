name: R2 DB backup test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icb-r2-db-backup-test
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate backup implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate/r2-supabase-backup-20260915
          persist-credentials: false
      - name: Validate candidate script syntax
        shell: bash
        run: bash -n scripts/r2-db-backup.sh
      - name: Create and verify R2 database backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: bash scripts/r2-db-backup.sh
