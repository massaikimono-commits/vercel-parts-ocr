name: R2 DB backup

on:
  workflow_dispatch:
  schedule:
    # 04:30 JST (19:30 UTC on the previous calendar day)
    - cron: '30 19 * * *'

permissions:
  contents: read

concurrency:
  group: icb-r2-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified backup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: candidate/r2-supabase-backup-20260915
          persist-credentials: false
      - name: Validate backup script syntax
        shell: bash
        run: bash -n scripts/r2-db-backup.sh
      - name: Create and verify R2 database backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: bash scripts/r2-db-backup.sh
