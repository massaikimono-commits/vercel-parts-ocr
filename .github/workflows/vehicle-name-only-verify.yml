name: Vehicle name-only rebased candidate verify

on:
  push:
    branches:
      - candidate/vehicle-register-name-only-rebased-20260915

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused regression
        run: node scripts/vehicle-name-only-regression.mjs
      - name: Full regression and build
        run: npm run build
      - name: Deployment safety
        run: |
          python - <<'PY'
          import pathlib, tomllib
          with pathlib.Path('netlify.toml').open('rb') as f:
              tomllib.load(f)
          print('netlify.toml syntax is valid.')
          PY
          node scripts/deployment-safety-regression.mjs
      - name: Protected diff audit
        run: |
          git diff --name-only cdabecadf993cff1b36bbbeda0b3998fcd71ec98...HEAD | tee /tmp/changed.txt
          if grep -E '^(supabase/|database/|app/certificate-|app/lib/certificate-|app/eval/|app/ocr/)' /tmp/changed.txt; then
            echo 'Protected DB/OCR path changed' >&2
            exit 1
          fi
          if grep -E '^(netlify.toml|wrangler.jsonc|vite.config.ts)$' /tmp/changed.txt; then
            echo 'Deployment configuration changed' >&2
            exit 1
          fi
          git diff --check cdabecadf993cff1b36bbbeda0b3998fcd71ec98...HEAD
