name: Month mobile visible row count batch
on:
  push:
    branches:
      - preview/schedule-ux-20260903
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_dummy_for_build_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/schedule/month/page.tsx')
          s=p.read_text()
          old='.monthRows .monthRow:nth-child(n+3){display:none}'
          new='.monthRows .monthRow:nth-child(n+4){display:none}'
          if old not in s: raise SystemExit('mobile row target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm ci
      - name: Regression
        run: |
          node scripts/month-mobile-visible-row-count-regression.mjs
          node scripts/security-regression.mjs
          node scripts/app-core-safety-regression.mjs
      - name: Full build
        run: npm run build
      - name: Commit intended source only
        run: |
          git checkout -- next-env.d.ts tsconfig.json public/tesseract || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schedule/month/page.tsx
          git diff --cached --quiet || git commit -m "ux: align mobile month visible row count [skip ci]"
          git push
