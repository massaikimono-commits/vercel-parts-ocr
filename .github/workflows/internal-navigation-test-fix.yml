name: Internal navigation test contract fix

on:
  push:
    branches:
      - candidate/internal-navigation-spa-20260914

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nav-test-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Fix direct fetch assertion only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/mobile-quick-nav-regression.mjs')
          s = p.read_text()
          old = 'assert(!nav.includes("fetch("), "quick nav must not add arbitrary fetch traffic");'
          new = 'assert(!/(^|[^A-Za-z])fetch\\s*\\(/m.test(nav), "quick nav must not add arbitrary direct fetch traffic");'
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile-quick-nav-regression.mjs
          git commit -m "test: distinguish Next prefetch from direct fetch [nav-test-fix]"
          git push origin HEAD:candidate/internal-navigation-spa-20260914
