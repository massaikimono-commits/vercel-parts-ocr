name: Cloudflare compatibility audit

on:
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read

jobs:
  compatibility:
    if: ${{ github.event.label.name == 'full-regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Cloudflare architecture gate
        run: node scripts/cloudflare-architecture-regression.mjs

      - name: Run official vinext compatibility check
        run: npx --yes vinext@latest check

      - name: Verify stock Next.js full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npx next build
