<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts OCR Stage A Row GT Annotator</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#111}
  header{padding:12px 16px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
  main{padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 320px}
  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
  canvas{max-width:100%;height:auto;border:1px solid #bbb;touch-action:none;background:#222}
  button,input{font:inherit}
  button{padding:8px 10px;margin:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .small{font-size:12px;color:#555}
  ol{padding-left:20px}
  li{margin:6px 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>Parts OCR Stage A — manual row-band Ground Truth annotator</strong>
  <div class="small">画像はローカルブラウザ内だけで処理。アップロード・OCR・自動候補利用なし。</div>
</header>
<main>
  <section class="card">
    <div class="row">
      <input id="files" type="file" accept="image/*" multiple>
      <button id="prev">← 前</button>
      <button id="next">次 →</button>
      <span id="status" class="small"></span>
    </div>
    <p class="small">
      操作：実際の明細1行ごとに、その行全体を覆うよう縦方向にドラッグしてください。
      x方向は採点に使いません。GTはy-bandのみです。
    </p>
    <canvas id="canvas"></canvas>
  </section>
  <aside class="card">
    <div class="row">
      <button id="undo">最後のbandを削除</button>
      <button id="clear">この画像を全削除</button>
    </div>
    <h3>現在のGT bands</h3>
    <ol id="bands"></ol>
    <hr>
    <div class="row">
      <button id="export">JSONを書き出す</button>
      <input id="import" type="file" accept="application/json,.json">
    </div>
    <p class="small">
      JSONにはファイル名、画像寸法、手動row-bandだけを保存します。
      OCR文字列・candidate・顧客情報の転記は保存しません。
    </p>
    <pre id="schema" class="small"></pre>
  </aside>
</main>
<script>
const filesEl=document.getElementById("files");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const bandsEl=document.getElementById("bands");
const data={version:1,kind:"parts-ocr-stage-a-row-geometry-gt",source:"manual-photo-annotation",images:{}};
let files=[],idx=0,img=null,startY=null;

function key(){ return files[idx]?.name || ""; }
function current(){
  const k=key();
  if(!k) return null;
  if(!data.images[k]) data.images[k]={filename:k,width:0,height:0,bands:[]};
  return data.images[k];
}
function norm(v,h){ return h ? +(v/h).toFixed(6) : 0; }

async function loadCurrent(){
  if(!files.length){ statusEl.textContent="画像未選択"; return; }
  const f=files[idx];
  img=new Image();
  img.src=URL.createObjectURL(f);
  await img.decode();
  canvas.width=img.naturalWidth;
  canvas.height=img.naturalHeight;
  const c=current();
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  statusEl.textContent=(idx+1)+"/"+files.length+"  "+f.name+"  "+c.bands.length+" bands";
  draw();
}
function draw(){
  if(!img) return;
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const c=current();
  ctx.save();
  ctx.fillStyle="rgba(255,0,0,.18)";
  ctx.strokeStyle="rgba(255,0,0,.95)";
  ctx.lineWidth=Math.max(2,canvas.width/800);
  for(const b of c.bands){
    const y1=b.y1Px, y2=b.y2Px;
    ctx.fillRect(0,y1,canvas.width,y2-y1);
    ctx.strokeRect(0,y1,canvas.width,y2-y1);
  }
  ctx.restore();
  bandsEl.innerHTML="";
  c.bands.forEach((b,i)=>{
    const li=document.createElement("li");
    li.textContent="#"+(i+1)+" y="+b.y1Px+".."+b.y2Px+"  ("+b.y1Norm+".."+b.y2Norm+")";
    bandsEl.appendChild(li);
  });
  statusEl.textContent=(idx+1)+"/"+files.length+"  "+key()+"  "+c.bands.length+" bands";
}
function canvasY(ev){
  const r=canvas.getBoundingClientRect();
  const clientY=(ev.touches?.[0]?.clientY ?? ev.clientY);
  return Math.round((clientY-r.top)*(canvas.height/r.height));
}
canvas.addEventListener("pointerdown",ev=>{ if(!img)return; startY=canvasY(ev); canvas.setPointerCapture(ev.pointerId); });
canvas.addEventListener("pointerup",ev=>{
  if(startY==null||!img)return;
  let endY=canvasY(ev); let y1=Math.max(0,Math.min(startY,endY)); let y2=Math.min(canvas.height,Math.max(startY,endY));
  startY=null;
  if(y2-y1<4)return;
  const c=current();
  c.bands.push({y1Px:y1,y2Px:y2,y1Norm:norm(y1,c.height),y2Norm:norm(y2,c.height)});
  c.bands.sort((a,b)=>a.y1Px-b.y1Px);
  draw();
});
filesEl.addEventListener("change",async()=>{
  files=Array.from(filesEl.files||[]);
  idx=0;
  await loadCurrent();
});
document.getElementById("prev").onclick=async()=>{ if(!files.length)return; idx=(idx-1+files.length)%files.length; await loadCurrent(); };
document.getElementById("next").onclick=async()=>{ if(!files.length)return; idx=(idx+1)%files.length; await loadCurrent(); };
document.getElementById("undo").onclick=()=>{ const c=current(); if(!c)return; c.bands.pop(); draw(); };
document.getElementById("clear").onclick=()=>{ const c=current(); if(!c)return; c.bands=[]; draw(); };
document.getElementById("export").onclick=()=>{
  const payload={...data,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="parts-ocr-stage-a-row-gt.json"; a.click();
};
document.getElementById("import").addEventListener("change",async ev=>{
  const f=ev.target.files?.[0]; if(!f)return;
  const parsed=JSON.parse(await f.text());
  if(parsed.kind!=="parts-ocr-stage-a-row-geometry-gt") throw new Error("invalid GT file");
  data.images=parsed.images||{};
  if(files.length) await loadCurrent();
});
document.getElementById("schema").textContent=
'GT schema: images[filename] = { width, height, bands:[{y1Px,y2Px,y1Norm,y2Norm}] }';
</script>
</body>
</html>
